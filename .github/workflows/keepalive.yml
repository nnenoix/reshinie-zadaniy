# Пинг сайта каждые 10 минут: бесплатный сервис Render засыпает после 15 минут без запросов,
# и первый запрос после сна ждёт около минуты. С пингом жюри открывает уже проснувшийся сайт.
# GitHub может запускать расписание с опозданием и отключает его в репозитории без коммитов 60 дней.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: GET /api/health
        run: >
          curl --fail --silent --show-error --max-time 90
          --retry 4 --retry-delay 20 --retry-all-errors
          https://reshinie-zadaniy.onrender.com/api/health
