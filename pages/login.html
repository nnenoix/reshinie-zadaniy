<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Вход · Решись Авиа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;family=Onest:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/js/tabs.js"></script>
<script type="module" src="/static/js/login.js"></script>
</head>
<body data-page="auth">
<div class="auth">
  <aside class="auth__side">
    <a class="brand" href="/">Решись Авиа</a>
    <div class="auth__body">
      <h1 class="auth__title">Прогноз <span class="accent">продаж</span> для каждого рейса</h1>
    </div>
  </aside>

  <main class="auth__main">
    <div class="card auth__card">
      <div class="tabs" role="tablist" aria-label="Способ входа">
        <!-- jury:start --><button class="tabs__btn" type="button" role="tab" id="tab-jury" aria-controls="jury-form" aria-selected="true" data-tab="jury">Вход для жюри</button><!-- jury:end -->
        <button class="tabs__btn" type="button" role="tab" id="tab-login" aria-controls="login-form" aria-selected="false" data-tab="login">Вход</button>
      </div>

      <!-- jury:start -->
      <form class="auth__form" id="jury-form" role="tabpanel" aria-labelledby="tab-jury" data-form="jury" action="/api/login" method="post" novalidate>
        <div class="alert" data-error="general" role="alert" hidden><span class="tag tag--err">Ошибка</span><span data-error-text></span></div>
        <div class="field" data-field="login">
          <label class="field__label" for="jury-login">Логин</label>
          <div class="field__box"><input class="field__control" type="text" id="jury-login" name="login" value="{{demo_login}}" readonly autocomplete="off"></div>
          <p class="field__error" data-error-for="login" hidden></p>
        </div>
        <div class="field" data-field="password">
          <label class="field__label" for="jury-password">Пароль</label>
          <div class="field__box"><input class="field__control" type="password" id="jury-password" name="password" value="{{demo_password}}" readonly autocomplete="off"><button class="field__toggle" type="button" data-toggle-password>Показать</button></div>
          <p class="field__error" data-error-for="password" hidden></p>
        </div>
        <button class="btn" type="submit">Войти</button>
        <p class="field__hint">Демо-аккаунт для проверки, данные уже введены.</p>
      </form>
      <!-- jury:end -->

      <form class="auth__form" id="login-form" role="tabpanel" aria-labelledby="tab-login" data-form="login" action="/api/login" method="post" novalidate hidden>
        <div class="alert" data-error="general" role="alert" hidden><span class="tag tag--err">Ошибка</span><span data-error-text></span></div>
        <div class="field" data-field="login">
          <label class="field__label" for="login-login">Логин или email</label>
          <div class="field__box"><input class="field__control" type="text" id="login-login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
          <p class="field__error" data-error-for="login" hidden></p>
        </div>
        <div class="field" data-field="password">
          <label class="field__label" for="login-password">Пароль</label>
          <div class="field__box"><input class="field__control" type="password" id="login-password" name="password" autocomplete="current-password" required><button class="field__toggle" type="button" data-toggle-password>Показать</button></div>
          <p class="field__error" data-error-for="password" hidden></p>
        </div>
        <button class="btn" type="submit">Войти</button>
      </form>

      <form class="auth__form" id="register-form" aria-label="Регистрация" data-form="register" action="/api/register" method="post" novalidate hidden>
        <div class="alert" data-error="general" role="alert" hidden><span class="tag tag--err">Ошибка</span><span data-error-text></span></div>
        <div class="field" data-field="login">
          <label class="field__label" for="reg-login">Логин или email</label>
          <div class="field__box"><input class="field__control" type="text" id="reg-login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
          <p class="field__hint">3–64 символа: русские и латинские буквы, цифры, . - _ @ +</p>
          <p class="field__error" data-error-for="login" hidden></p>
        </div>
        <div class="field" data-field="password">
          <label class="field__label" for="reg-password">Пароль</label>
          <div class="field__box"><input class="field__control" type="password" id="reg-password" name="password" autocomplete="new-password" required><button class="field__toggle" type="button" data-toggle-password>Показать</button></div>
          <p class="field__hint">Не короче 8 символов</p>
          <p class="field__error" data-error-for="password" hidden></p>
        </div>
        <div class="field" data-field="password2">
          <label class="field__label" for="reg-password2">Повторите пароль</label>
          <div class="field__box"><input class="field__control" type="password" id="reg-password2" name="password2" autocomplete="new-password" required></div>
          <p class="field__error" data-error-for="password2" hidden></p>
        </div>
        <button class="btn" type="submit">Создать аккаунт</button>
        <p class="auth__switch">Уже есть аккаунт? <button class="link-btn" type="button" data-tab="login">Войти</button></p>
      </form>

      <p class="auth__switch auth__switch--muted" data-register-line>Нет аккаунта? <button class="link-btn" type="button" data-tab="register">Зарегистрироваться</button></p>
    </div>
  </main>
</div>
</body>
</html>
