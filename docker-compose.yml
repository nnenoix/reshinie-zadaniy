# Запуск: docker compose up -d --build   →   http://localhost:8000
services:
  app:
    build: .
    image: aviaprognoz
    ports:
      - "8000:8000"
    environment:
      COOKIE_SECURE: "0"                         # на хостинге с HTTPS поставьте "1"
      # Прогноз нашей модели уже лежит в образе: data/my_forecast.csv.
      # Чтобы читать свежий файл из папки ../ml, раскомментируйте две строки ниже и том в volumes.
      # ML_FORECAST_CSV: /app/ml/my_forecast.csv
    volumes:
      - app-data:/app/var                        # пользователи, сессии, история — переживают перезапуск
      # - ../ml:/app/ml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
